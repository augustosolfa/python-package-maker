name: Build Portable Application

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-portable-app:
    name: Build & Package App
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build portable Windows ZIP package
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-app-dist
          path: dist/*.zip

      - name: Attach ZIP to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
